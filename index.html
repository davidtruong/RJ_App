<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jungle Air Command</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="900" height="650"></canvas>

    <!-- Start Screen -->
    <div id="overlay">
      <div class="overlay-content">
        <h1>Jungle Air Command</h1>
        <p class="subtitle">Escape the alligator. Conquer the jungle skies.</p>
        <div class="instructions">
          <div class="instruction-col">
            <h3>Movement</h3>
            <p>Arrow Keys / WASD</p>
            <h3>Weapons</h3>
            <p>SPACE - Drop Bananas</p>
            <p>E - Coconut Bomb</p>
            <p>Q - Vine Net</p>
          </div>
          <div class="instruction-col">
            <h3>Build Allies</h3>
            <p>1 - Fighter Plane (100g)</p>
            <p>2 - Bomber Plane (200g)</p>
            <p>3 - Healer Plane (150g)</p>
            <h3>Survive the waves!</h3>
          </div>
        </div>
        <button id="startBtn">Launch Mission</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverOverlay" class="hidden">
      <div class="overlay-content">
        <h1 id="endTitle">Mission Failed</h1>
        <p id="endMessage"></p>
        <div id="endStats"></div>
        <p id="finalScore"></p>
        <button id="restartBtn">Retry Mission</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
